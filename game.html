<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En campagne · President Material</title>
  <meta name="description" content="Menez votre carrière politique jusqu'à la présidence.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='80' text-anchor='middle' fill='%23c9a24b'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-create page-game" data-page-title="page_title_game">

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-star" aria-hidden="true">★</span>
        <span class="logo-text">President Material</span>
      </a>

      <span aria-hidden="true"></span>

      <nav class="lang-switch" aria-label="Language switch">
        <button type="button" class="lang-btn is-active" data-lang="fr">FR</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-layout game-layout">

        <!-- ===== Fiche du candidat, mise à jour en direct ===== -->
        <aside class="sheet game-sheet" aria-live="polite">
          <div class="sheet-inner">
            <div class="sheet-head">
              <span class="sheet-star" aria-hidden="true">★</span>
              <p class="sheet-label" data-i18n="sheet_label">Fiche du candidat</p>
              <p class="sheet-name" id="sheet-name"></p>
              <p class="sheet-meta" id="sheet-meta"></p>
              <p class="sheet-meta sheet-position" id="sheet-meta-2"></p>
            </div>

            <div class="sheet-stats">
              <!-- Les deux jauges de carrière, propres à la partie en cours -->
              <div class="gauges">
                <div class="gauge">
                  <div class="gauge-head">
                    <span class="gauge-label" id="gauge-pop-label"></span>
                    <span class="gauge-value" id="gauge-pop-value">0</span>
                  </div>
                  <span class="gauge-track"><span class="gauge-fill gauge-fill-pop" id="gauge-pop-fill"></span></span>
                </div>
                <div class="gauge">
                  <div class="gauge-head">
                    <span class="gauge-label" id="gauge-standing-label"></span>
                    <span class="gauge-value" id="gauge-standing-value">0</span>
                  </div>
                  <span class="gauge-track"><span class="gauge-fill gauge-fill-standing" id="gauge-standing-fill"></span></span>
                </div>
              </div>

              <!-- Jauges de statistiques générées par js/data.js -->
              <div id="sheet-stat-groups"></div>

              <!-- Ce que la carrière a laissé sur le personnage. Les traits
                   remontent juste sous les statistiques : ils se lisent avec
                   elles, puisqu'ils les modifient. -->
              <div class="sheet-traits">
                <p class="sheet-group-title" data-i18n="label_traits">Traits</p>
                <div id="trait-rows"></div>
              </div>

              <!-- L'ARGENT, EN BAS ET D'UN SEUL TENANT. La fortune était une
                   ligne isolée au milieu de la fiche et le budget se trouvait
                   trois blocs plus bas : on ne pouvait pas lire ce qu'on a et
                   ce qu'on en fait au même endroit. -->
              <div class="sheet-purse">
                <p class="sheet-group-title" data-i18n="money_section">Vos moyens</p>
                <div class="sheet-money">
                  <span class="sheet-money-label" data-i18n="money_label">Fortune</span>
                  <span class="sheet-money-value" id="sheet-money">0 €</span>
                  <span class="sheet-money-balance" id="sheet-balance"></span>
                </div>
                <div id="sheet-budget"></div>
              </div>
            </div>

            <div class="sheet-actions">
              <button type="button" class="ghost-btn" id="retire-btn" data-i18n="game_retire">Prendre sa retraite</button>
            </div>
          </div>
        </aside>

        <!-- ===== La carte du tour, le pays autour, puis le journal ===== -->
        <section class="form-col game-col">

          <!-- Ce qui arrive : les quatre prochaines échéances, et ce
               qu'elles veulent dire pour le joueur. -->
          <nav class="calendar" id="election-calendar" aria-live="polite" hidden></nav>

          <div id="event-area" aria-live="polite"></div>

          <!-- Deux rapports de force, et ce ne sont pas les mêmes : ce que
               pèsent les camps dans l'opinion, et ce qu'ils tiennent à
               l'Assemblée. Un onglet chacun. -->
          <div class="side-panel">
            <div class="panel-tabs" role="tablist">
              <button type="button" class="panel-tab is-active" role="tab"
                      data-tab="assembly" data-i18n="tab_power">Le pouvoir</button>
              <button type="button" class="panel-tab" role="tab"
                      data-tab="landscape" data-i18n="tab_opinion">Dans l'opinion</button>
            </div>
            <div class="panel-pane" id="pane-assembly" role="tabpanel"></div>
            <div class="panel-pane" id="pane-landscape" role="tabpanel" hidden></div>
          </div>

          <div class="side-panel side-panel-quiet">
            <p class="panel-title" data-i18n="label_journal">Journal</p>
            <div class="panel-pane" id="pane-journal"></div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script src="js/names.data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/traits.data.js"></script>
  <script src="js/budget.data.js"></script>
  <script src="js/endings.data.js"></script>
  <!-- Événements, éclatés par thème puis assemblés dans EVENT_DATA.
       Tous les EV_* doivent être chargés avant _assemble.data.js, qui les
       concatène, lui-même avant game-data.js qui lit EVENT_DATA. -->
  <script src="js/events/debuts.data.js"></script>
  <script src="js/events/medias.data.js"></script>
  <script src="js/events/argent.data.js"></script>
  <script src="js/events/appareil.data.js"></script>
  <script src="js/events/chaines.data.js"></script>
  <script src="js/events/rivaux.data.js"></script>
  <script src="js/events/vie_privee.data.js"></script>
  <script src="js/events/partis.data.js"></script>
  <script src="js/events/caractere.data.js"></script>
  <script src="js/events/institutions.data.js"></script>
  <script src="js/events/assemblee.data.js"></script>
  <script src="js/events/grandes_decisions.data.js"></script>
  <script src="js/events/divers.data.js"></script>
  <script src="js/events/campaign.data.js"></script>
  <script src="js/events/runoff.data.js"></script>
  <script src="js/events/nomination.data.js"></script>
  <script src="js/events/support.data.js"></script>
  <script src="js/events/aside.data.js"></script>
  <script src="js/events/races.data.js"></script>
  <script src="js/events/_assemble.data.js"></script>
  <script src="js/game-data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
