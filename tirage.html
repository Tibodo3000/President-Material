<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le tirage · President Material</title>
  <meta name="description" content="Ce que le sort a distribué à votre personnage avant sa première décision.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='80' text-anchor='middle' fill='%23c9a24b'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-create page-draw" data-page-title="page_title_draw">

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-star" aria-hidden="true">★</span>
        <span class="logo-text">President Material</span>
      </a>

      <ol class="steps" aria-label="Étapes">
        <li class="step is-done">
          <span class="step-num">1</span>
          <span class="step-label" data-i18n="step_character">Personnage</span>
        </li>
        <li class="step is-done">
          <span class="step-num">2</span>
          <span class="step-label" data-i18n="step_party">Parti</span>
        </li>
        <li class="step is-current">
          <span class="step-num">3</span>
          <span class="step-label" data-i18n="step_draw">Tirage</span>
        </li>
      </ol>

      <nav class="lang-switch" aria-label="Language switch">
        <button type="button" class="lang-btn is-active" data-lang="fr">FR</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container draw-page">

      <p class="eyebrow" data-i18n="draw_tag">Avant de commencer</p>
      <h1 class="draw-heading" id="draw-name"></h1>
      <p class="draw-meta" id="draw-meta"></p>

      <p class="draw-intro" id="draw-intro"></p>

      <div id="draw-cards"></div>

      <div class="draw-actions">
        <a href="game.html" class="btn btn-primary btn-xl" id="draw-begin"
           data-i18n="draw_begin">Commencer la carrière</a>
        <p class="draw-back" data-i18n="draw_final">Cette main est la vôtre. On ne rejoue pas un tirage parce qu'il ne plaît pas.</p>
      </div>

    </div>
  </main>

  <script src="js/script.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/names.data.js"></script>
  <script src="js/traits.data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tirage.js"></script>
</body>
</html>
